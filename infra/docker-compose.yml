version: "3.8"

services:

  # =========================
  # QDRANT - Vector Database
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hr_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage


  # =========================
  # POSTGRESQL - HR Database
  # =========================
  postgres:
    image: postgres:16
    container_name: hr_postgres

    environment:
      POSTGRES_DB: hr_assistant_db
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: hr_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_storage:/var/lib/postgresql/data


# =========================
# PERSISTENT VOLUMES
# =========================
volumes:

  qdrant_storage:

  postgres_storage: